[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-backend"
version = "0.1.0"
description = "ADAPT adaptive learning platform backend (FastAPI + SQLCipher/SQLite + two AI roles)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The blueprint targets Python 3.12+; >=3.11 keeps Debian bookworm and CI system Python working.
# What has actually been *run* here is 3.11.2 -- no 3.12 interpreter was available, so the
# floor is a claim and 3.11.2 is a measurement. Note the voice stack: `kokoro` requires <3.13,
# so "3.12 or newer" is not safe advice for a full install with local speech.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20",
  "websockets>=14,<16",
  "numpy>=1.26",
  "cryptography>=44.0",
  "argon2-cffi>=23.1",
  "sqlcipher3-binary>=0.5.4; platform_machine == 'x86_64' or platform_machine == 'aarch64'",
  "typer>=0.15",
  "rich>=13.9",
]

[project.optional-dependencies]
# Optional local speech stack. Kept out of the core install because it pulls in
# torch (~2 GB) and needs a one-off Hugging Face model download. See
# docs/VOICE.md for measured cost/latency and the browser fallback path.
voice = [
  "faster-whisper>=1.1,<2.0",
  "kokoro>=0.9.4,<0.10",
  "soundfile>=0.13",
  "webrtcvad>=2.0.10; python_version < '3.13'",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "anyio>=4.6",
  "ruff>=0.9",
  "mypy>=1.14",
]

[project.scripts]
adapt = "adapt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]
