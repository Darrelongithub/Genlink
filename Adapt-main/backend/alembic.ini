# Alembic for ADAPT. The app itself still calls ``create_all`` for a fresh database (see
# api/app.py lifespan); this exists so an *existing* database can be moved forward without
# deleting a learner's history, which is the case create_all cannot serve.
[alembic]
script_location = migrations
# Deliberately empty: the URL comes from the app's own settings, so ADAPT_DATA_DIR /
# ADAPT_DB_PATH decide which database is migrated and there is no second copy of the path
# to drift out of sync here.
sqlalchemy.url =
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
